[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "life360-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for Life360 API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
life360-mcp = "life360_mcp.server:main"
